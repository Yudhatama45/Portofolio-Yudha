<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0a1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1035;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0eaf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c4b5d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  
  <!-- Left angle bracket < -->
  <path d="M 108 256 L 168 196 L 168 220 L 132 256 L 168 292 L 168 316 Z" fill="url(#purple)" />
  
  <!-- Right angle bracket > (mirrored) -->
  <path d="M 404 256 L 344 196 L 344 220 L 380 256 L 344 292 L 344 316 Z" fill="url(#purple)" />
  
  <!-- Forward slash / -->
  <path d="M 295 170 L 310 170 L 217 342 L 202 342 Z" fill="url(#purple)" opacity="0.8"/>
  
  <!-- Y letter -->
  <text x="216" y="295" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="160" fill="url(#textGrad)" text-anchor="middle">Y</text>
  
  <!-- T letter -->
  <text x="316" y="295" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="160" fill="url(#textGrad)" text-anchor="middle">T</text>
</svg>
